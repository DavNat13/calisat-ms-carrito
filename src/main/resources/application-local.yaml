# Perfil local (docker compose): los microservicios se resuelven por
# nombre de servicio dentro de la red compartida calisat-net.
# CERO IPs de maquina: en despliegue no se activa este perfil y
# manda calisat.gateway.url del application.yaml principal.
calisat:
  urls:
    catalogo: http://calisat-ms-catalogo:8080
    inventario: http://calisat-ms-inventario:8080
